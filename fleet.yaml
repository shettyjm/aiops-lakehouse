# Fleet spec for the synthetic 2,000-VM telemetry generator (M1).
# Counts sum to 2000 across the two sites (round-robin split, ~50/50).
# Each app carries a per-metric baseline mean; noise is added as a fraction
# of the mean (noise_pct, with per-metric floors so near-zero means still wiggle).

sample_interval_s: 30
noise_pct: 0.08          # gaussian noise std = noise_pct * baseline mean

# 25 globally distributed sites, each tagged by type and region (multi-site /
# multi-jurisdiction fleet). Sites may be plain strings (legacy) or {name, type,
# region} maps. The (site -> type, region) mapping is emitted as a `sites`
# dimension table so vm_metrics keeps its contract; join on `site` to slice by
# location_type or region. Types: manufacturing | warehouse | sales_office |
# customer_club. VMs are round-robin-assigned across sites.
sites:
  - {name: na-plant-chicago,    type: manufacturing, region: NA}
  - {name: na-plant-detroit,    type: manufacturing, region: NA}
  - {name: na-wh-dallas,        type: warehouse,     region: NA}
  - {name: na-wh-atlanta,       type: warehouse,     region: NA}
  - {name: na-sales-nyc,        type: sales_office,  region: NA}
  - {name: na-club-la,          type: customer_club, region: NA}
  - {name: na-club-miami,       type: customer_club, region: NA}
  - {name: emea-plant-manchester, type: manufacturing, region: EMEA}
  - {name: emea-wh-rotterdam,   type: warehouse,     region: EMEA}
  - {name: emea-sales-london,   type: sales_office,  region: EMEA}
  - {name: emea-club-paris,     type: customer_club, region: EMEA}
  - {name: emea-club-madrid,    type: customer_club, region: EMEA}
  - {name: dach-plant-stuttgart, type: manufacturing, region: DACH}
  - {name: dach-plant-munich,   type: manufacturing, region: DACH}
  - {name: dach-wh-frankfurt,   type: warehouse,     region: DACH}
  - {name: dach-sales-berlin,   type: sales_office,  region: DACH}
  - {name: dach-club-vienna,    type: customer_club, region: DACH}
  - {name: apac-plant-shenzhen, type: manufacturing, region: APAC}
  - {name: apac-wh-singapore,   type: warehouse,     region: APAC}
  - {name: apac-wh-tokyo,       type: warehouse,     region: APAC}
  - {name: apac-sales-sydney,   type: sales_office,  region: APAC}
  - {name: apac-club-mumbai,    type: customer_club, region: APAC}
  - {name: latam-plant-saopaulo, type: manufacturing, region: LATAM}
  - {name: latam-wh-mexico,     type: warehouse,     region: LATAM}
  - {name: latam-sales-bogota,  type: sales_office,  region: LATAM}

# Per-type baseline multipliers on metric means (applied per VM by its site type).
# Shapes each location type's workload/failure profile. Missing metric = 1.0.
type_profiles:
  manufacturing:   # MES/line-side, steady load, low variance
    {cpu_pct: 1.05, app_latency_ms: 0.9, error_rate_pct: 0.7, net_mbps: 0.9}
  warehouse:       # WMS/fulfillment, bursty around shipping windows; io/heap pressure
    {disk_io_await_ms: 1.4, disk_iops: 1.3, heap_mb: 1.15, gc_pause_ms: 1.2, net_mbps: 1.1}
  sales_office:    # ERP/CRM clients, business-hours diurnal
    {cpu_pct: 0.9, app_latency_ms: 1.1, net_mbps: 0.8}
  customer_club:   # POS/storefront, revenue-facing, latency-sensitive
    {net_mbps: 1.25, app_latency_ms: 1.05, error_rate_pct: 1.2, disk_iops: 1.1}

# App-level dependency edges (M5): "app depends_on the listed apps". Drives the
# topology table and the blast-radius graph traversal. Reflects the chains
# patient-onboarding -> ehr-api -> postgres-db and hl7-ingest -> kafka -> ehr-api.
topology:
  patient-onboarding: [ehr-api]
  ehr-api: [postgres-db]
  hl7-ingest: [kafka]
  kafka: [ehr-api]
  billing-svc: [postgres-db]
  scheduler-svc: [ehr-api]

# All nine numeric metrics from the vm_metrics data contract must be present
# in every app baseline. Units: cpu_pct %, heap_mb MB, gc_pause_ms ms,
# disk_io_await_ms ms, disk_iops iops, net_mbps Mbps, net_retrans_pct %,
# app_latency_ms ms, error_rate_pct %.
apps:
  patient-onboarding:
    count: 220
    baseline: {cpu_pct: 35, heap_mb: 1800, gc_pause_ms: 40, disk_io_await_ms: 5,
               disk_iops: 800, net_mbps: 120, net_retrans_pct: 0.3,
               app_latency_ms: 90, error_rate_pct: 0.2}
  ehr-api:
    count: 380
    baseline: {cpu_pct: 45, heap_mb: 2200, gc_pause_ms: 55, disk_io_await_ms: 6,
               disk_iops: 1200, net_mbps: 200, net_retrans_pct: 0.4,
               app_latency_ms: 70, error_rate_pct: 0.3}
  scheduler-svc:
    count: 180
    baseline: {cpu_pct: 25, heap_mb: 1200, gc_pause_ms: 30, disk_io_await_ms: 4,
               disk_iops: 400, net_mbps: 60, net_retrans_pct: 0.2,
               app_latency_ms: 60, error_rate_pct: 0.15}
  billing-svc:
    count: 160
    baseline: {cpu_pct: 30, heap_mb: 1500, gc_pause_ms: 35, disk_io_await_ms: 5,
               disk_iops: 500, net_mbps: 80, net_retrans_pct: 0.25,
               app_latency_ms: 110, error_rate_pct: 0.25}
  hl7-ingest:
    count: 140
    baseline: {cpu_pct: 40, heap_mb: 1600, gc_pause_ms: 45, disk_io_await_ms: 7,
               disk_iops: 900, net_mbps: 150, net_retrans_pct: 0.5,
               app_latency_ms: 130, error_rate_pct: 0.4}
  postgres-db:
    count: 90
    baseline: {cpu_pct: 50, heap_mb: 800, gc_pause_ms: 5, disk_io_await_ms: 8,
               disk_iops: 2000, net_mbps: 90, net_retrans_pct: 0.3,
               app_latency_ms: 25, error_rate_pct: 0.1}
  kafka:
    count: 60
    baseline: {cpu_pct: 45, heap_mb: 3000, gc_pause_ms: 60, disk_io_await_ms: 6,
               disk_iops: 1500, net_mbps: 300, net_retrans_pct: 0.35,
               app_latency_ms: 15, error_rate_pct: 0.1}
  generic-worker:
    count: 770
    baseline: {cpu_pct: 20, heap_mb: 900, gc_pause_ms: 20, disk_io_await_ms: 4,
               disk_iops: 300, net_mbps: 40, net_retrans_pct: 0.2,
               app_latency_ms: 50, error_rate_pct: 0.15}
